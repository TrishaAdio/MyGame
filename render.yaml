services:
  - type: web
    name: castle-of-magic-rooms
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # Render creates a random secret. Copy it from the dashboard into the game later.
      - key: ACCESS_KEY
        generateValue: true
